<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fusion FPS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#f2f2f5;font:16px/1.4 -apple-system,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;margin:0}
video{width:100%;background:#000;border-radius:12px;aspect-ratio:16/9;object-fit:contain}
button,select{font:inherit;border-radius:10px;border:1px solid #2c2c33;background:#1c1c21;color:#f2f2f5;padding:12px 14px}
button.primary{background:#2f6bff;border-color:#2f6bff;font-weight:600}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 90px}
#status,#note{font-size:14px;color:#a8a8b3;white-space:pre-line}
progress{width:100%;height:10px}
canvas{width:100%;background:#000;border-radius:12px}
.hide{position:absolute;left:0;top:0;width:160px;height:90px;opacity:.01;pointer-events:none;z-index:-1}
a#dl{display:none;text-align:center;text-decoration:none;color:#fff;background:#1f9d55;border-radius:10px;padding:12px;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Fusion FPS</h1>
<video id="cam" playsinline muted autoplay></video>
<canvas id="livecv" hidden></canvas>
<div id="status">Camera off.</div>
<div class="row">
<select id="res"><option value="640" selected>640 wide</option><option value="960">960 wide</option><option value="1280">1280 wide</option></select>
<select id="mode"><option value="rec" selected>Record + build</option><option value="cam">Real-time camera</option></select>
<select id="len" class="off"><option value="2">2 s</option><option value="3" selected>3 s</option><option value="4">4 s</option></select>
<select id="target" class="off"></select>
<select id="speed" class="off"><option value="60" selected>Slo-mo 60 fps (smoother)</option><option value="30">Slo-mo 30 fps</option><option value="real">Real time</option></select>
<select id="lslow" class="lv" hidden><option value="1" selected>Live speed 1x</option><option value="2">1/2x</option><option value="4">1/4x</option><option value="8">1/8x</option></select>
<select id="lres" class="lv" hidden><option value="320">Live 320 wide</option><option value="480" selected>Live 480 wide</option><option value="640">Live 640 wide</option></select>
<button id="fxbtn" class="lv" hidden>Effect: on</button>
</div>
<button class="primary" id="start">Start camera</button>
<button id="rec" disabled>Capture &amp; build</button>
<progress id="prog" value="0" max="1" hidden></progress>
<video id="out" controls playsinline loop hidden></video>
<a id="dl">Download MP4</a>
<div id="note">Records one take and synthesizes up to 32x more frames with motion estimation for smooth slow-mo (pick a high target with 60 fps playback). Real-time camera mode runs the same effect live, about one frame behind. The extra frames are generated, not captured.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>
<script>
const $=id=>document.getElementById(id);
const cam=$('cam'),statusEl=$('status'),startBtn=$('start'),targetSel=$('target'),resSel=$('res'),lenSel=$('len'),speedSel=$('speed'),modeSel=$('mode'),livecv=$('livecv'),lslowSel=$('lslow'),lresSel=$('lres'),fxBtn=$('fxbtn'),recBtn=$('rec'),prog=$('prog'),out=$('out'),dl=$('dl');
const fc=document.createElement('canvas');
const fx=fc.getContext('2d');
const wc=document.createElement('canvas');
const wx=wc.getContext('2d',{willReadFrequently:true});
const oc=document.createElement('canvas');
const ox=oc.getContext('2d');
const BS=8;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let stream=null,baseFps=30,busy=false;

function fillTargets(){
  const prev=+targetSel.value;
  targetSel.innerHTML='';
  for(let m=2;;m*=2){
    const t=baseFps*m;
    if(t>1920)break;
    const o=document.createElement('option');
    o.value=t;o.textContent=t+' fps';
    targetSel.appendChild(o);
  }
  if([...targetSel.options].some(o=>+o.value===prev))targetSel.value=prev;
}

function measureFps(ms){
  return new Promise(res=>{
    let n=0,t0=0;
    const step=now=>{
      if(!t0)t0=now;else n++;
      if(now-t0>=ms)res(n/((now-t0)/1000));
      else cam.requestVideoFrameCallback(step);
    };
    cam.requestVideoFrameCallback(step);
  });
}

async function openCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const w=+resSel.value,h=Math.round(w*9/16);
  const base={facingMode:{ideal:'environment'},width:{ideal:w},height:{ideal:h}};
  let s=null;
  for(const fr of [{exact:60},{ideal:60,min:45},{ideal:30}]){
    try{s=await navigator.mediaDevices.getUserMedia({video:{...base,frameRate:fr},audio:false});break}catch(e){}
  }
  if(!s)throw new Error('Camera unavailable');
  stream=s;
  cam.srcObject=s;
  await cam.play();
  const m=await measureFps(1200);
  baseFps=m>=50?60:m>=27?30:Math.max(10,Math.round(m));
  fillTargets();
  statusEl.textContent='Camera running at '+baseFps+' fps ('+m.toFixed(1)+' measured), '+cam.videoWidth+'x'+cam.videoHeight+'.';
  recBtn.disabled=false;
}

function setBusy(b){
  busy=b;
  recBtn.disabled=b||!stream;
}

function recordTake(seconds){
  return new Promise(res=>{
    const w=cam.videoWidth&~1,h=cam.videoHeight&~1;
    fc.width=w;fc.height=h;
    const blobs=[];
    let t0=0;
    const step=now=>{
      if(!t0)t0=now;
      fx.drawImage(cam,0,0,w,h);
      blobs.push(new Promise(r=>fc.toBlob(r,'image/jpeg',0.9)));
      if(now-t0>=seconds*1000)Promise.all(blobs).then(b=>res({blobs:b,w,h}));
      else cam.requestVideoFrameCallback(step);
    };
    cam.requestVideoFrameCallback(step);
  });
}

async function loadFrame(blob,w,h){
  const b=await createImageBitmap(blob);
  wc.width=w;wc.height=h;
  wx.drawImage(b,0,0,w,h);
  b.close();
  return wx.getImageData(0,0,w,h);
}

function halfGray(d,w,h){
  const hw=w>>1,hh=h>>1,g=new Uint8Array(hw*hh),px=d.data;
  for(let y=0;y<hh;y++)for(let x=0;x<hw;x++){
    const i=(y*2*w+x*2)*4;
    g[y*hw+x]=(px[i]+2*px[i+1]+px[i+2])>>2;
  }
  return g;
}

function blockSad(a,b,hw,x,y,dx,dy,limit){
  let s=0;
  for(let j=0;j<BS;j++){
    const ra=(y+j)*hw+x,rb=(y+j+dy)*hw+x+dx;
    for(let i=0;i<BS;i++){const d=a[ra+i]-b[rb+i];s+=d<0?-d:d}
    if(s>=limit)return s;
  }
  return s;
}

function motionField(a,b,hw,hh){
  const bw=Math.floor(hw/BS),bh=Math.floor(hh/BS);
  const vx=new Float32Array(bw*bh),vy=new Float32Array(bw*bh);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
    const x=bx*BS,y=by*BS;
    let cx=0,cy=0,best=blockSad(a,b,hw,x,y,0,0,1e9);
    if(best>BS*BS*2){
      for(const step of [8,4,2,1]){
        let nx=cx,ny=cy;
        for(let dy=-step;dy<=step;dy+=step)for(let dx=-step;dx<=step;dx+=step){
          if(!dx&&!dy)continue;
          const tx=cx+dx,ty=cy+dy;
          if(x+tx<0||y+ty<0||x+tx+BS>hw||y+ty+BS>hh)continue;
          const s=blockSad(a,b,hw,x,y,tx,ty,best*0.98);
          if(s<best*0.98){best=s;nx=tx;ny=ty}
        }
        cx=nx;cy=ny;
      }
    }
    vx[by*bw+bx]=cx*2;vy[by*bw+bx]=cy*2;
  }
  return {vx,vy,bw,bh};
}

function medianField(f){
  const {vx,vy,bw,bh}=f;
  const mx=new Float32Array(vx.length),my=new Float32Array(vy.length);
  const ax=new Float32Array(9),ay=new Float32Array(9);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
    let n=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const xx=Math.min(Math.max(bx+dx,0),bw-1),yy=Math.min(Math.max(by+dy,0),bh-1);
      ax[n]=vx[yy*bw+xx];ay[n]=vy[yy*bw+xx];n++;
    }
    ax.sort();ay.sort();
    mx[by*bw+bx]=ax[4];my[by*bw+bx]=ay[4];
  }
  return {vx:mx,vy:my,bw,bh};
}

function denseField(f,w,h){
  const PX=new Float32Array(w*h),PY=new Float32Array(w*h);
  const {vx,vy,bw,bh}=f;
  const sc=1/(BS*2);
  for(let y=0;y<h;y++){
    const fy=Math.min(Math.max(y*sc-0.5,0),bh-1),y0=Math.floor(fy),y1=Math.min(y0+1,bh-1),wy=fy-y0;
    for(let x=0;x<w;x++){
      const fxx=Math.min(Math.max(x*sc-0.5,0),bw-1),x0=Math.floor(fxx),x1=Math.min(x0+1,bw-1),wxx=fxx-x0;
      const i00=y0*bw+x0,i10=y0*bw+x1,i01=y1*bw+x0,i11=y1*bw+x1;
      const a=1-wxx;
      PX[y*w+x]=(vx[i00]*a+vx[i10]*wxx)*(1-wy)+(vx[i01]*a+vx[i11]*wxx)*wy;
      PY[y*w+x]=(vy[i00]*a+vy[i10]*wxx)*(1-wy)+(vy[i01]*a+vy[i11]*wxx)*wy;
    }
  }
  return {PX,PY};
}

function synth(d0,d1,PX,PY,t,o,w,h){
  const u=1-t;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x,vx=PX[i],vy=PY[i];
    let x0=Math.round(x-t*vx),y0=Math.round(y-t*vy),x1=Math.round(x+u*vx),y1=Math.round(y+u*vy);
    x0=x0<0?0:x0>=w?w-1:x0;y0=y0<0?0:y0>=h?h-1:y0;
    x1=x1<0?0:x1>=w?w-1:x1;y1=y1<0?0:y1>=h?h-1:y1;
    const j0=(y0*w+x0)*4,j1=(y1*w+x1)*4,k=i*4;
    const diff=Math.abs(d0[j0]-d1[j1])+Math.abs(d0[j0+1]-d1[j1+1])+Math.abs(d0[j0+2]-d1[j1+2]);
    if(diff>96){
      const src=t<0.5?d0:d1;
      o[k]=src[k];o[k+1]=src[k+1];o[k+2]=src[k+2];
    }else{
      o[k]=d0[j0]*u+d1[j1]*t;o[k+1]=d0[j0+1]*u+d1[j1+1]*t;o[k+2]=d0[j0+2]*u+d1[j1+2]*t;
    }
    o[k+3]=255;
  }
}

async function pickCodec(w,h,fps,bitrate){
  for(const codec of ['avc1.640033','avc1.4d0033','avc1.64002a','avc1.42003e']){
    try{
      const cfg={codec,width:w,height:h,bitrate,framerate:fps};
      const r=await VideoEncoder.isConfigSupported(cfg);
      if(r.supported)return cfg;
    }catch(e){}
  }
  return null;
}

async function build(take){
  setBusy(true);
  prog.hidden=false;prog.value=0;
  out.hidden=true;dl.style.display='none';
  try{
    const target=+targetSel.value;
    const m=Math.round(target/baseFps);
    const w=take.w,h=take.h,N=take.blobs.length,hw=w>>1,hh=h>>1;
    if(N<2)throw new Error('Take too short.');
    const playFps=playRate(target);
    const bitrate=Math.min(60e6,Math.round(w*h*Math.max(playFps,30)*0.1));
    const cfg=await pickCodec(w,h,playFps,bitrate);
    if(!cfg)throw new Error('This browser cannot encode H.264 at '+playFps+' fps. Try a lower target.');
    const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:w,height:h},fastStart:'in-memory'});
    let encErr=null;
    const enc=new VideoEncoder({output:(c,mt)=>muxer.addVideoChunk(c,mt),error:e=>{encErr=e}});
    enc.configure(cfg);
    const od=new ImageData(w,h);
    oc.width=w;oc.height=h;
    let idx=0;
    const push=async()=>{
      if(encErr)throw encErr;
      ox.putImageData(od,0,0);
      const frame=new VideoFrame(oc,{timestamp:Math.round(idx*1e6/playFps),duration:Math.round(1e6/playFps)});
      enc.encode(frame,{keyFrame:idx%Math.round(playFps)===0});
      frame.close();
      idx++;
      while(enc.encodeQueueSize>16)await sleep(4);
    };
    statusEl.textContent='Rendering '+((N-1)*m+1)+' frames...';
    let d0=await loadFrame(take.blobs[0],w,h);
    let g0=halfGray(d0,w,h);
    for(let i=0;i<N-1;i++){
      const d1=await loadFrame(take.blobs[i+1],w,h);
      const g1=halfGray(d1,w,h);
      const f=medianField(motionField(g0,g1,hw,hh));
      const {PX,PY}=denseField(f,w,h);
      od.data.set(d0.data);
      await push();
      for(let k=1;k<m;k++){
        synthSmooth(d0.data,d1.data,PX,PY,k/m,od.data,w,h);
        await push();
      }
      d0=d1;g0=g1;
      prog.value=i/(N-1);
      await sleep(0);
    }
    od.data.set(d0.data);
    await push();
    await enc.flush();
    muxer.finalize();
    const blob=new Blob([muxer.target.buffer],{type:'video/mp4'});
    const url=URL.createObjectURL(blob);
    out.src=url;out.hidden=false;
    dl.href=url;dl.download='fusion_'+target+'fps'+(playFps===target?'':'_slowmo')+'.mp4';dl.style.display='block';
    statusEl.textContent='Done: '+idx+' frames, '+m+'x from '+baseFps+' fps, playing at '+playFps+' fps ('+(idx/playFps).toFixed(2)+' s'+(playFps<target?', '+(target/playFps).toFixed(1)+'x slower':'')+').';
  }catch(e){
    statusEl.textContent='Error: '+(e.message||e);
  }
  prog.hidden=true;
  setBusy(false);
}

function playRate(target){
  const v=speedSel.value;
  return v==='real'?Math.min(target,480):Math.min(target,+v);
}

function synthSmooth(d0,d1,PX,PY,t,o,w,h){
  const u=1-t,wm=w-1,hm=h-1;
  const va=[0,0,0],vb=[0,0,0];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x,vx=PX[i],vy=PY[i];
    let ax=x-t*vx,ay=y-t*vy,bx=x+u*vx,by=y+u*vy;
    ax=ax<0?0:ax>wm?wm:ax;ay=ay<0?0:ay>hm?hm:ay;
    bx=bx<0?0:bx>wm?wm:bx;by=by<0?0:by>hm?hm:by;
    const ax0=ax|0,ay0=ay|0,ax1=ax0<wm?ax0+1:wm,ay1=ay0<hm?ay0+1:hm,fa=ax-ax0,ga=ay-ay0;
    const bx0=bx|0,by0=by|0,bx1=bx0<wm?bx0+1:wm,by1=by0<hm?by0+1:hm,fb=bx-bx0,gb=by-by0;
    const a00=(ay0*w+ax0)*4,a10=(ay0*w+ax1)*4,a01=(ay1*w+ax0)*4,a11=(ay1*w+ax1)*4;
    const b00=(by0*w+bx0)*4,b10=(by0*w+bx1)*4,b01=(by1*w+bx0)*4,b11=(by1*w+bx1)*4;
    const k=i*4;
    let diff=0;
    for(let c=0;c<3;c++){
      va[c]=(d0[a00+c]*(1-fa)+d0[a10+c]*fa)*(1-ga)+(d0[a01+c]*(1-fa)+d0[a11+c]*fa)*ga;
      vb[c]=(d1[b00+c]*(1-fb)+d1[b10+c]*fb)*(1-gb)+(d1[b01+c]*(1-fb)+d1[b11+c]*fb)*gb;
      diff+=Math.abs(va[c]-vb[c]);
    }
    if(diff>96){
      const src=t<0.5?d0:d1;
      o[k]=src[k];o[k+1]=src[k+1];o[k+2]=src[k+2];
    }else{
      o[k]=va[0]*u+vb[0]*t;o[k+1]=va[1]*u+vb[1]*t;o[k+2]=va[2]*u+vb[2]*t;
    }
    o[k+3]=255;
  }
}

const lcan=document.createElement('canvas');
const lx=lcan.getContext('2d',{willReadFrequently:true});
const live={on:false,fx:true,q:[],base:0,L:-1,pos:0,pair:-1,PX:null,PY:null,od:null,W:0,H:0,tL:0,last:0,frames:0,t0:0};

function updateUI(){
  const cm=modeSel.value==='cam';
  document.querySelectorAll('.off').forEach(e=>{e.hidden=cm});
  document.querySelectorAll('.lv').forEach(e=>{e.hidden=!cm});
  recBtn.textContent=cm?(live.on?'Stop live view':'Start live view'):'Capture & build';
}

function liveFrame(){
  if(!live.on)return;
  lx.drawImage(cam,0,0,live.W,live.H);
  live.q.push(lx.getImageData(0,0,live.W,live.H).data);
  live.L++;
  live.tL=performance.now();
  const maxQ=Math.max(8,Math.round(baseFps*3));
  while(live.q.length>maxQ){live.q.shift();live.base++}
  cam.requestVideoFrameCallback(liveFrame);
}

function liveRender(now){
  if(!live.on)return;
  requestAnimationFrame(liveRender);
  const L=live.L;
  if(L<1)return;
  const N=+lslowSel.value;
  const dt=Math.min(100,now-live.last)/1000;
  live.last=now;
  let pos;
  if(N===1){
    pos=(L-1)+Math.min(1,Math.max(0,(performance.now()-live.tL)/(1000/baseFps)));
    live.pos=pos;
  }else{
    live.pos=Math.max(live.base,Math.min(L,live.pos+dt*baseFps/N));
    pos=live.pos;
  }
  const k=Math.min(Math.max(Math.floor(pos),live.base),L-1);
  const t=Math.min(1,Math.max(0,pos-k));
  const f0=live.q[k-live.base],f1=live.q[k+1-live.base];
  const W=live.W,H=live.H;
  if(live.fx){
    if(live.pair!==k){
      const g0=halfGray({data:f0},W,H),g1=halfGray({data:f1},W,H);
      const f=medianField(motionField(g0,g1,W>>1,H>>1));
      const d=denseField(f,W,H);
      live.PX=d.PX;live.PY=d.PY;live.pair=k;
    }
    synth(f0,f1,live.PX,live.PY,t,live.od.data,W,H);
  }else{
    live.od.data.set(N===1?live.q[L-live.base]:(t<0.5?f0:f1));
  }
  livecv.getContext('2d').putImageData(live.od,0,0);
  live.frames++;
  if(now-live.t0>=500){
    const fps=live.frames*1000/(now-live.t0);
    const lag=Math.round((L-pos)*1000/baseFps);
    statusEl.textContent='Live: '+fps.toFixed(0)+' fps shown, camera '+baseFps+' fps, '+(live.fx?'effect on':'effect off')+', behind by '+lag+' ms.';
    live.frames=0;live.t0=now;
  }
}

function startLive(){
  const W=(+lresSel.value)&~1;
  const H=(Math.round(W*9/16)>>1)<<1;
  livecv.width=W;livecv.height=H;
  lcan.width=W;lcan.height=H;
  live.W=W;live.H=H;
  live.q=[];live.base=0;live.L=-1;live.pos=0;live.pair=-1;live.frames=0;
  live.od=new ImageData(W,H);
  live.on=true;
  live.last=performance.now();live.t0=live.last;
  cam.classList.add('hide');
  livecv.hidden=false;
  cam.requestVideoFrameCallback(liveFrame);
  requestAnimationFrame(liveRender);
  updateUI();
}

function stopLive(){
  live.on=false;
  cam.classList.remove('hide');
  livecv.hidden=true;
  live.q=[];
  updateUI();
}

startBtn.onclick=async()=>{
  try{await openCamera()}catch(e){statusEl.textContent='Error: '+(e.message||e)}
};
resSel.onchange=()=>{if(stream)startBtn.click()};
recBtn.onclick=async()=>{
  if(modeSel.value==='cam'){
    if(live.on)stopLive();else startLive();
    return;
  }
  setBusy(true);
  statusEl.textContent='Recording...';
  const t=await recordTake(+lenSel.value);
  await build(t);
};
modeSel.onchange=()=>{if(live.on)stopLive();updateUI()};
fxBtn.onclick=()=>{live.fx=!live.fx;fxBtn.textContent='Effect: '+(live.fx?'on':'off')};
lresSel.onchange=()=>{if(live.on){stopLive();startLive()}};
fillTargets();
updateUI();
</script>
</body>
</html>
