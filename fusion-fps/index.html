<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bounce Cam</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#f2f2f5;font:16px/1.4 -apple-system,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;margin:0}
video{width:100%;background:#000;border-radius:12px;aspect-ratio:16/9;object-fit:contain}
canvas{width:100%;background:#000;border-radius:12px}
button{font:inherit;border-radius:10px;border:1px solid #2c2c33;background:#1c1c21;color:#f2f2f5;padding:12px 14px}
button.primary{background:#2f6bff;border-color:#2f6bff;font-weight:600}
label.rng{display:flex;align-items:center;gap:12px;font-size:15px}
label.rng span{width:90px}
label.rng input{flex:1}
#status,#note{font-size:14px;color:#a8a8b3;white-space:pre-line}
.hide{position:absolute;left:0;top:0;width:160px;height:90px;opacity:.01;pointer-events:none;z-index:-1}
</style>
</head>
<body>
<main>
<h1>Bounce Cam</h1>
<video id="cam" playsinline muted autoplay></video>
<canvas id="livecv" hidden></canvas>
<div id="status">Camera off.</div>
<label class="rng"><span>Bounce</span><input type="range" id="bounce" min="1" max="10" value="5"></label>
<label class="rng"><span>Wobble time</span><input type="range" id="wobble" min="3" max="20" value="9"></label>
<button class="primary" id="start">Start camera</button>
<div id="note">Live camera. When something moving suddenly stops, like a hand hitting a leg, the area keeps moving, springs back and ripples outward, over and over. It is a jelly-style approximation driven by motion estimation, not real physics. Hold the phone still for the best result.</div>
</main>
<script>
const $=id=>document.getElementById(id);
const cam=$('cam'),statusEl=$('status'),startBtn=$('start'),livecv=$('livecv'),bounceEl=$('bounce'),wobbleEl=$('wobble');
const lctx=livecv.getContext('2d');
const lcan=document.createElement('canvas');
const lx=lcan.getContext('2d',{willReadFrequently:true});
const BS=8,LIVE_W=480;
let stream=null,baseFps=30;
const live={on:false,W:0,H:0,bw:0,bh:0,pg:null,dx:null,dy:null,ux:null,uy:null,pvx:null,pvy:null,od:null,frames:0,t0:0,hits:0};

function measureFps(ms){
  return new Promise(res=>{
    let n=0,t0=0;
    const step=now=>{
      if(!t0)t0=now;else n++;
      if(now-t0>=ms)res(n/((now-t0)/1000));
      else cam.requestVideoFrameCallback(step);
    };
    cam.requestVideoFrameCallback(step);
  });
}

async function openCamera(){
  stopLive();
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const base={facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}};
  let s=null;
  for(const fr of [{exact:60},{ideal:60,min:45},{ideal:30}]){
    try{s=await navigator.mediaDevices.getUserMedia({video:{...base,frameRate:fr},audio:false});break}catch(e){}
  }
  if(!s)throw new Error('Camera unavailable');
  stream=s;
  cam.srcObject=s;
  await cam.play();
  const m=await measureFps(1200);
  baseFps=m>=50?60:m>=27?30:Math.max(10,Math.round(m));
  startLive();
}

function halfGray(d,w,h){
  const hw=w>>1,hh=h>>1,g=new Uint8Array(hw*hh),px=d.data;
  for(let y=0;y<hh;y++)for(let x=0;x<hw;x++){
    const i=(y*2*w+x*2)*4;
    g[y*hw+x]=(px[i]+2*px[i+1]+px[i+2])>>2;
  }
  return g;
}

function blockSad(a,b,hw,x,y,dx,dy,limit){
  let s=0;
  for(let j=0;j<BS;j++){
    const ra=(y+j)*hw+x,rb=(y+j+dy)*hw+x+dx;
    for(let i=0;i<BS;i++){const d=a[ra+i]-b[rb+i];s+=d<0?-d:d}
    if(s>=limit)return s;
  }
  return s;
}

function motionField(a,b,hw,hh){
  const bw=Math.floor(hw/BS),bh=Math.floor(hh/BS);
  const vx=new Float32Array(bw*bh),vy=new Float32Array(bw*bh);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
    const x=bx*BS,y=by*BS;
    let cx=0,cy=0,best=blockSad(a,b,hw,x,y,0,0,1e9);
    if(best>BS*BS*2){
      for(const step of [8,4,2,1]){
        let nx=cx,ny=cy;
        for(let dy=-step;dy<=step;dy+=step)for(let dx=-step;dx<=step;dx+=step){
          if(!dx&&!dy)continue;
          const tx=cx+dx,ty=cy+dy;
          if(x+tx<0||y+ty<0||x+tx+BS>hw||y+ty+BS>hh)continue;
          const s=blockSad(a,b,hw,x,y,tx,ty,best*0.98);
          if(s<best*0.98){best=s;nx=tx;ny=ty}
        }
        cx=nx;cy=ny;
      }
    }
    vx[by*bw+bx]=cx*2;vy[by*bw+bx]=cy*2;
  }
  return {vx,vy,bw,bh};
}

function medianField(f){
  const {vx,vy,bw,bh}=f;
  const mx=new Float32Array(vx.length),my=new Float32Array(vy.length);
  const ax=new Float32Array(9),ay=new Float32Array(9);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
    let n=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const xx=Math.min(Math.max(bx+dx,0),bw-1),yy=Math.min(Math.max(by+dy,0),bh-1);
      ax[n]=vx[yy*bw+xx];ay[n]=vy[yy*bw+xx];n++;
    }
    ax.sort();ay.sort();
    mx[by*bw+bx]=ax[4];my[by*bw+bx]=ay[4];
  }
  return {vx:mx,vy:my,bw,bh};
}

function denseField(f,w,h){
  const PX=new Float32Array(w*h),PY=new Float32Array(w*h);
  const {vx,vy,bw,bh}=f;
  const sc=1/(BS*2);
  for(let y=0;y<h;y++){
    const fy=Math.min(Math.max(y*sc-0.5,0),bh-1),y0=Math.floor(fy),y1=Math.min(y0+1,bh-1),wy=fy-y0;
    for(let x=0;x<w;x++){
      const fxx=Math.min(Math.max(x*sc-0.5,0),bw-1),x0=Math.floor(fxx),x1=Math.min(x0+1,bw-1),wxx=fxx-x0;
      const i00=y0*bw+x0,i10=y0*bw+x1,i01=y1*bw+x0,i11=y1*bw+x1;
      const a=1-wxx;
      PX[y*w+x]=(vx[i00]*a+vx[i10]*wxx)*(1-wy)+(vx[i01]*a+vx[i11]*wxx)*wy;
      PY[y*w+x]=(vy[i00]*a+vy[i10]*wxx)*(1-wy)+(vy[i01]*a+vy[i11]*wxx)*wy;
    }
  }
  return {PX,PY};
}

function startLive(){
  const W=LIVE_W,H=(Math.round(W*cam.videoHeight/cam.videoWidth)>>1)<<1;
  livecv.width=W;livecv.height=H;
  lcan.width=W;lcan.height=H;
  const hw=W>>1,hh=H>>1,bw=Math.floor(hw/BS),bh=Math.floor(hh/BS),n=bw*bh;
  Object.assign(live,{on:true,W,H,bw,bh,pg:null,dx:new Float32Array(n),dy:new Float32Array(n),ux:new Float32Array(n),uy:new Float32Array(n),pvx:new Float32Array(n),pvy:new Float32Array(n),od:new ImageData(W,H),frames:0,t0:performance.now(),hits:0});
  cam.classList.add('hide');
  livecv.hidden=false;
  cam.requestVideoFrameCallback(liveFrame);
}

function stopLive(){
  live.on=false;
  cam.classList.remove('hide');
  livecv.hidden=true;
}

function step(f){
  const {bw,bh,dx,dy,ux,uy,pvx,pvy}=live,n=bw*bh;
  const gain=+bounceEl.value*0.2;
  const tau=+wobbleEl.value/10;
  const w0=2*Math.PI*4.5/baseFps,k=w0*w0,c=2/(tau*baseFps),kn=0.2;
  const sx=Float32Array.from(f.vx).sort(),sy=Float32Array.from(f.vy).sort();
  const gx=sx[n>>1],gy=sy[n>>1];
  for(let i=0;i<n;i++){
    const vx=f.vx[i]-gx,vy=f.vy[i]-gy;
    const px=pvx[i],py=pvy[i],sp=Math.hypot(px,py);
    if(sp>3){
      const dec=-((vx-px)*px+(vy-py)*py)/sp;
      if(dec>sp*0.6&&dec>2){
        const m=Math.min(dec,14)*gain;
        ux[i]+=px/sp*m;uy[i]+=py/sp*m;
        live.hits++;
      }
    }
    pvx[i]=px*0.5+vx*0.5;pvy[i]=py*0.5+vy*0.5;
  }
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
    const i=y*bw+x;
    const l=x>0?i-1:i,r=x<bw-1?i+1:i,u=y>0?i-bw:i,d=y<bh-1?i+bw:i;
    const lapx=(dx[l]+dx[r]+dx[u]+dx[d])*0.25-dx[i],lapy=(dy[l]+dy[r]+dy[u]+dy[d])*0.25-dy[i];
    ux[i]+=-k*dx[i]-c*ux[i]+kn*lapx;
    uy[i]+=-k*dy[i]-c*uy[i]+kn*lapy;
  }
  for(let i=0;i<n;i++){
    dx[i]=Math.max(-40,Math.min(40,dx[i]+ux[i]));
    dy[i]=Math.max(-40,Math.min(40,dy[i]+uy[i]));
  }
}

function warp(s,PX,PY,o,w,h){
  const wm=w-1.001,hm=h-1.001;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;
    let sx=x-PX[i],sy=y-PY[i];
    sx=sx<0?0:sx>wm?wm:sx;sy=sy<0?0:sy>hm?hm:sy;
    const x0=sx|0,y0=sy|0,fx=sx-x0,fy=sy-y0,j=(y0*w+x0)*4,k=i*4;
    const a=(1-fx)*(1-fy),b=fx*(1-fy),c=(1-fx)*fy,d=fx*fy;
    o[k]=s[j]*a+s[j+4]*b+s[j+w*4]*c+s[j+w*4+4]*d;
    o[k+1]=s[j+1]*a+s[j+5]*b+s[j+w*4+1]*c+s[j+w*4+5]*d;
    o[k+2]=s[j+2]*a+s[j+6]*b+s[j+w*4+2]*c+s[j+w*4+6]*d;
    o[k+3]=255;
  }
}

function liveFrame(){
  if(!live.on)return;
  cam.requestVideoFrameCallback(liveFrame);
  const {W,H,bw,bh}=live;
  lx.drawImage(cam,0,0,W,H);
  const img=lx.getImageData(0,0,W,H);
  const g=halfGray(img,W,H);
  if(live.pg)step(medianField(motionField(live.pg,g,W>>1,H>>1)));
  live.pg=g;
  const d=denseField({vx:live.dx,vy:live.dy,bw,bh},W,H);
  warp(img.data,d.PX,d.PY,live.od.data,W,H);
  lctx.putImageData(live.od,0,0);
  live.frames++;
  const now=performance.now();
  if(now-live.t0>=500){
    statusEl.textContent='Live: '+(live.frames*1000/(now-live.t0)).toFixed(0)+' fps, camera '+baseFps+' fps, impacts '+live.hits+'.';
    live.frames=0;live.hits=0;live.t0=now;
  }
}

startBtn.onclick=async()=>{
  try{await openCamera()}catch(e){statusEl.textContent='Error: '+(e.message||e)}
};
</script>
</body>
</html>
