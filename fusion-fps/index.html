<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fusion FPS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#f2f2f5;font:16px/1.4 -apple-system,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;margin:0}
video{width:100%;background:#000;border-radius:12px;aspect-ratio:16/9;object-fit:contain}
button,select{font:inherit;border-radius:10px;border:1px solid #2c2c33;background:#1c1c21;color:#f2f2f5;padding:12px 14px}
button.primary{background:#2f6bff;border-color:#2f6bff;font-weight:600}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 90px}
#status,#takes,#note{font-size:14px;color:#a8a8b3;white-space:pre-line}
progress{width:100%;height:10px}
a#dl{display:none;text-align:center;text-decoration:none;color:#fff;background:#1f9d55;border-radius:10px;padding:12px;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Fusion FPS</h1>
<video id="cam" playsinline muted autoplay></video>
<div id="status">Camera off.</div>
<div class="row">
<select id="res"><option value="640">640 wide</option><option value="960" selected>960 wide</option><option value="1280">1280 wide</option></select>
<select id="len"><option value="2">2 s takes</option><option value="3" selected>3 s takes</option><option value="4">4 s takes</option></select>
<select id="target"></select>
<select id="speed"><option value="slow" selected>Slow-mo</option><option value="real">Real time</option></select>
</div>
<button class="primary" id="start">Start camera</button>
<button class="primary" id="rec" disabled>Capture &amp; build</button>
<div id="takes"></div>
<progress id="prog" value="0" max="1" hidden></progress>
<video id="out" controls playsinline loop hidden></video>
<a id="dl">Download MP4</a>
<div id="note">Film a repeating motion (spinning fan, pendulum, metronome) from a fixed camera. Capture records all needed takes back to back with random gaps, aligns them by image matching, and interleaves them into the target frame rate. Slow-mo plays the result at 30 fps.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.js"></script>
<script>
const $=id=>document.getElementById(id);
const cam=$('cam'),statusEl=$('status'),startBtn=$('start'),targetSel=$('target'),resSel=$('res'),lenSel=$('len'),recBtn=$('rec'),speedSel=$('speed'),takesEl=$('takes'),prog=$('prog'),out=$('out'),dl=$('dl');
const GW=32,GH=18;
const gc=document.createElement('canvas');gc.width=GW;gc.height=GH;
const gx=gc.getContext('2d',{willReadFrequently:true});
const fc=document.createElement('canvas');
const fx=fc.getContext('2d');
let stream=null,baseFps=30,takes=[],busy=false;

function fillTargets(){
  const prev=+targetSel.value;
  targetSel.innerHTML='';
  for(let m=2;m<=16;m*=2){
    const t=baseFps*m;
    if(t>480)break;
    const o=document.createElement('option');
    o.value=t;o.textContent=t+' fps ('+m+' takes)';
    targetSel.appendChild(o);
  }
  if([...targetSel.options].some(o=>+o.value===prev))targetSel.value=prev;
}

function measureFps(ms){
  return new Promise(res=>{
    let n=0,t0=0;
    const step=now=>{
      if(!t0)t0=now;else n++;
      if(now-t0>=ms)res(n/((now-t0)/1000));
      else cam.requestVideoFrameCallback(step);
    };
    cam.requestVideoFrameCallback(step);
  });
}

async function openCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const w=+resSel.value,h=Math.round(w*9/16);
  const base={facingMode:{ideal:'environment'},width:{ideal:w},height:{ideal:h}};
  let s=null;
  for(const fr of [{exact:60},{ideal:60,min:45},{ideal:30}]){
    try{s=await navigator.mediaDevices.getUserMedia({video:{...base,frameRate:fr},audio:false});break}catch(e){}
  }
  if(!s)throw new Error('Camera unavailable');
  stream=s;
  cam.srcObject=s;
  await cam.play();
  const m=await measureFps(1200);
  baseFps=m>=50?60:m>=27?30:Math.max(10,Math.round(m));
  fillTargets();
  statusEl.textContent='Camera running at '+baseFps+' fps ('+m.toFixed(1)+' measured), '+cam.videoWidth+'x'+cam.videoHeight+'.\nTargets: '+[...targetSel.options].map(o=>o.value).join(', ')+' fps.';
  recBtn.disabled=false;
  takes=[];
  renderTakes();
}

function renderTakes(){
  const need=+targetSel.value/baseFps||2;
  takesEl.textContent=takes.length?'Takes: '+takes.length+'/'+need:'Needs '+need+' takes, recorded automatically.';
  recBtn.disabled=busy||!stream;
}

function recordTake(seconds){
  return new Promise(res=>{
    const w=cam.videoWidth&~1,h=cam.videoHeight&~1;
    fc.width=w;fc.height=h;
    const gray=[],blobs=[];
    let t0=0;
    const step=now=>{
      if(!t0)t0=now;
      fx.drawImage(cam,0,0,w,h);
      gx.drawImage(cam,0,0,GW,GH);
      const d=gx.getImageData(0,0,GW,GH).data;
      const g=new Float32Array(GW*GH);
      for(let i=0;i<g.length;i++)g[i]=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255;
      gray.push(g);
      blobs.push(new Promise(r=>fc.toBlob(r,'image/jpeg',0.88)));
      if(now-t0>=seconds*1000)Promise.all(blobs).then(b=>res({gray,blobs:b,w,h}));
      else cam.requestVideoFrameCallback(step);
    };
    cam.requestVideoFrameCallback(step);
  });
}

function dist(a,b){let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d}return s}

function alignTake(A,B){
  const nA=A.length,nB=B.length,minN=Math.min(nA,nB);
  const maxLag=Math.floor(minN*0.5);
  let best=Infinity,bl=0;
  for(let L=-maxLag;L<=maxLag;L++){
    let s=0,c=0;
    for(let j=Math.max(0,-L);j<nB&&j+L<nA;j++){s+=dist(B[j],A[j+L]);c++}
    if(c<minN*0.4)continue;
    s/=c;
    if(s<best){best=s;bl=L}
  }
  let num=0,den=0;
  for(let j=0;j<nB;j++){
    const k=j+bl;
    if(k<0||k+1>=nA)continue;
    const a0=A[k],a1=A[k+1],b=B[j];
    for(let i=0;i<b.length;i++){const d=a1[i]-a0[i];num+=(b[i]-a0[i])*d;den+=d*d}
  }
  const alpha=den>1e-9?Math.max(-1,Math.min(1,num/den)):0;
  return bl+alpha;
}

function nearest(items,u){
  let lo=0,hi=items.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;if(items[mid].T<u)lo=mid+1;else hi=mid}
  if(lo>0&&Math.abs(items[lo-1].T-u)<=Math.abs(items[lo].T-u))lo--;
  return items[lo];
}

async function pickCodec(w,h,target,bitrate){
  for(const codec of ['avc1.640033','avc1.4d0033','avc1.64002a','avc1.42003e']){
    try{
      const cfg={codec,width:w,height:h,bitrate,framerate:target};
      const r=await VideoEncoder.isConfigSupported(cfg);
      if(r.supported)return cfg;
    }catch(e){}
  }
  return null;
}

async function build(){
  busy=true;renderTakes();
  prog.hidden=false;prog.value=0;
  out.hidden=true;dl.style.display='none';
  try{
    const target=+targetSel.value;
    statusEl.textContent='Aligning takes...';
    await new Promise(r=>setTimeout(r,30));
    const A=takes[0].gray;
    const offsets=[0];
    for(let k=1;k<takes.length;k++){
      offsets.push(alignTake(A,takes[k].gray));
      await new Promise(r=>setTimeout(r,0));
    }
    const items=[];
    takes.forEach((t,k)=>t.blobs.forEach((b,j)=>items.push({T:j+offsets[k],b})));
    items.sort((x,y)=>x.T-y.T);
    const lo=Math.max(...offsets.map(o=>o));
    const hi=Math.min(...takes.map((t,k)=>t.blobs.length-1+offsets[k]));
    const n=Math.floor((hi-lo)*target/baseFps);
    if(n<2)throw new Error('Takes do not overlap enough. Re-record with the same repeating motion.');
    const phases=offsets.map(o=>((o%1)+1)%1).map(p=>p.toFixed(2)).join(', ');
    const w=takes[0].w,h=takes[0].h;
    const playFps=speedSel.value==='slow'?30:target;
    const bitrate=Math.min(60e6,Math.round(w*h*Math.max(playFps,30)*0.1));
    const cfg=await pickCodec(w,h,playFps,bitrate);
    if(!cfg)throw new Error('This browser cannot encode H.264 at '+playFps+' fps. Try a lower target.');
    const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:w,height:h},fastStart:'in-memory'});
    let encErr=null;
    const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{encErr=e}});
    enc.configure(cfg);
    statusEl.textContent='Phases: '+phases+'\nEncoding '+n+' frames...';
    let last=null,dups=0;
    for(let i=0;i<n;i++){
      if(encErr)throw encErr;
      const item=nearest(items,lo+i*baseFps/target);
      if(item===last)dups++;
      last=item;
      const bmp=await createImageBitmap(item.b);
      const frame=new VideoFrame(bmp,{timestamp:Math.round(i*1e6/playFps),duration:Math.round(1e6/playFps)});
      enc.encode(frame,{keyFrame:i%Math.round(playFps)===0});
      frame.close();bmp.close();
      while(enc.encodeQueueSize>16)await new Promise(r=>setTimeout(r,4));
      if(i%8===0){prog.value=i/n;await new Promise(r=>setTimeout(r,0))}
    }
    await enc.flush();
    muxer.finalize();
    const blob=new Blob([muxer.target.buffer],{type:'video/mp4'});
    const url=URL.createObjectURL(blob);
    out.src=url;out.hidden=false;
    dl.href=url;dl.download='fusion_'+target+'fps'+(playFps===target?'':'_slowmo')+'.mp4';dl.style.display='block';
    statusEl.textContent='Done: '+n+' frames captured at '+target+' fps, playing at '+playFps+' fps ('+(n/playFps).toFixed(2)+' s'+(playFps<target?', '+(target/playFps).toFixed(1)+'x slower':'')+').\nPhases: '+phases+'\nRepeated frames: '+dups+' ('+Math.round(100*dups/n)+'%). High means phases bunched up; record more takes.';
  }catch(e){
    statusEl.textContent='Error: '+(e.message||e);
  }
  prog.hidden=true;
  busy=false;renderTakes();
}

startBtn.onclick=async()=>{
  try{await openCamera()}catch(e){statusEl.textContent='Error: '+(e.message||e)}
};
resSel.onchange=()=>{if(stream)startBtn.click()};
targetSel.onchange=renderTakes;
recBtn.onclick=async()=>{
  busy=true;takes=[];renderTakes();
  const need=Math.round(+targetSel.value/baseFps);
  for(let i=0;i<need;i++){
    statusEl.textContent='Recording take '+(i+1)+' of '+need+'...';
    takes.push(await recordTake(+lenSel.value));
    renderTakes();
    await new Promise(r=>setTimeout(r,150+Math.random()*450));
  }
  busy=false;
  await build();
};
fillTargets();
renderTakes();
</script>
</body>
</html>
